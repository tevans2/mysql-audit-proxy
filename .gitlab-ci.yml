# Runs on every push. The image ships gcc, which the API needs — mattn/go-sqlite3
# is a cgo package, so CGO_ENABLED=0 would fail to build the store.

image: golang:1.26

variables:
  # Keep the module cache inside the project so it can be cached between jobs.
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

cache:
  key: go-mod
  paths:
    - .go/pkg/mod
    - .cache/go-build

stages:
  - lint
  - test
  - e2e

# Both runners available to this project are tagged, and a tagged runner only
# picks up untagged jobs if it is configured to. Without this the jobs sit
# pending rather than failing, which looks like CI not existing at all.
lint:
  stage: lint
  tags:
    - shared-docker-runner
  script:
    # Only our tracked files. GOPATH is inside the project so the module cache
    # can be cached between jobs, which puts every dependency's source under
    # .go/ -- "gofmt -l ." walks into it and reports third-party formatting.
    - test -z "$(gofmt -l $(git ls-files '*.go'))" || { echo 'not gofmt formatted:'; gofmt -l $(git ls-files '*.go'); exit 1; }
    - go mod download
    - go vet ./...

test:
  stage: test
  # Needs the Docker executor specifically: image: and services: below are
  # silently ignored by a shell runner, which would then run on the host.
  tags:
    - shared-docker-runner
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: rootpass
    MYSQL_DATABASE: demo
    MYSQL_USER: demo
    MYSQL_PASSWORD: demopass
    # Without an upstream the proxy's integration tests skip themselves, which
    # would quietly cover far less than it looks like. Point them at the service.
    PROXY_TEST_UPSTREAM_ADDR: mysql:3306
    PROXY_TEST_UPSTREAM_USER: root
    PROXY_TEST_UPSTREAM_PASS: rootpass
    # Fail, don't skip, if the upstream is unreachable: a MySQL service that
    # never starts must turn the pipeline red, not green with nothing tested.
    PROXY_TEST_REQUIRE_UPSTREAM: "1"
  script:
    # GitLab starts services without waiting for them. Without this wait the
    # proxy's integration tests would race MySQL starting up.
    - for i in $(seq 1 60); do (echo > /dev/tcp/mysql/3306) >/dev/null 2>&1 && break; sleep 2; done
    - go mod download
    - go test -count=1 -shuffle=on ./...

# Drives the built binaries the way the compose stack does: a proxy in front of
# each of two databases, the API collecting what they emit, asserted by reading
# back over HTTP. Separate from `test` because it needs two upstreams, and
# because a failure here means the system is broken rather than a package.
e2e:
  stage: e2e
  tags:
    - shared-docker-runner
  services:
    # Both take MYSQL_ROOT_PASSWORD from the job variables below, so the two
    # share credentials and differ by schema instead. Per-service `variables:`
    # would let them differ, but support for it depends on the GitLab version
    # and a silently ignored block would leave a service with no password set.
    - name: mysql:8.0
      alias: db-a
    - name: mysql:8.0
      alias: db-b
  variables:
    MYSQL_ROOT_PASSWORD: rootpass
    E2E_DB_A_ADDR: db-a:3306
    E2E_DB_A_USER: root
    E2E_DB_A_PASS: rootpass
    E2E_DB_B_ADDR: db-b:3306
    E2E_DB_B_USER: root
    E2E_DB_B_PASS: rootpass
    # The tests skip when an upstream is unreachable, which in CI is
    # indistinguishable from passing. This turns that skip into a failure.
    E2E_REQUIRE: "1"
  script:
    # GitLab starts services without waiting for them, and both must be up: a
    # test that raced one of them would fail on connection refused rather than
    # on anything it means to assert.
    - for host in db-a db-b; do
        for i in $(seq 1 60); do
          (echo > /dev/tcp/$host/3306) >/dev/null 2>&1 && break;
          sleep 2;
        done;
      done
    # The per-user accounts' passwords are generated here rather than committed:
    # the tests create the accounts on these bare containers themselves.
    - export E2E_DB_A_ALICE_PASS=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
    - export E2E_DB_A_BOOTSTRAP_PASS=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
    - export E2E_DB_B_BOB_PASS=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
    - export E2E_DB_B_BOOTSTRAP_PASS=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
    - go mod download
    - go test -count=1 -v -timeout 30m ./e2e/

# The UI's pure helpers and the CSP source check. Its own job because the Go
# image has no node, and because neither needs a database to run.
web:
  stage: test
  image: node:22
  tags:
    - shared-docker-runner
  script:
    - node --test 'web/**/*.test.mjs'
    - make csp-check
